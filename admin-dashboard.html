<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<style>
body{
font-family:Arial,sans-serif;
margin:0;
background:#f5f5f5;
}

header{
background:black;
color:white;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.container{
padding:30px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.card h3{
margin-top:0;
}

button{
background:black;
color:white;
border:none;
padding:10px 20px;
border-radius:5px;
cursor:pointer;
}
</style>
</head>

<body>

<header>
<h2>Luxury Hairs Admin</h2>
<button onclick="logout()">Logout</button>
</header>

<div class="container">

<div class="grid">

<div class="card">
<h3>Products</h3>
<p>Manage products and pricing.</p>
</div>

<div class="card">
<h3>Orders</h3>
<p>View customer orders.</p>
</div>

<div class="card">
<h3>Inventory</h3>
<p>Track stock levels.</p>
</div>

<div class="card">
<h3>Customers</h3>
<p>Manage customer records.</p>
</div>

<div class="card">
<h3>Payments</h3>
<p>Monitor payment activity.</p>
</div>

<div class="card">
<h3>Website Settings</h3>
<p>Update website information.</p>
</div>

</div>

</div>

<script>
function logout(){
window.location.href='admin-login.html';
}
</script>

</body>
</html>
