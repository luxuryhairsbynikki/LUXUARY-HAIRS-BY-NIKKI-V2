<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products Management</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    padding:20px;
}

h1{
    color:gold;
    margin-bottom:20px;
}

input,select{
    width:100%;
    padding:12px;
    margin-bottom:10px;
    border:none;
    border-radius:5px;
    box-sizing:border-box;
}

button{
    background:gold;
    color:black;
    border:none;
    padding:12px;
    cursor:pointer;
    font-weight:bold;
    width:100%;
    margin-bottom:20px;
    border-radius:5px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:gold;
    color:black;
    padding:10px;
}

td{
    padding:10px;
    border:1px solid #333;
}

.delete-btn{
    background:red;
    color:white;
    width:auto;
    padding:8px 12px;
    margin:0;
}

.message{
    padding:12px;
    margin-bottom:15px;
    border-radius:5px;
    display:none;
}

.success{
    background:#0f5132;
}

.error{
    background:#842029;
}
</style>
</head>

<body>

<h1>Products Management</h1>

<div id="message" class="message"></div>

<input type="text" id="name" placeholder="Product Name">

<select id="category">
<option>Luxury Wigs</option>
<option>Thrift Hairs</option>
<option>Bundles</option>
<option>Closures</option>
<option>Frontals</option>
</select>

<input type="number" id="price" placeholder="Price">

<input type="number" id="stock" placeholder="Stock Quantity">

<button id="addBtn">Add Product</button>

<table>
<thead>
<tr>
<th>Name</th>
<th>Category</th>
<th>Price</th>
<th>Stock</th>
<th>Action</th>
</tr>
</thead>

<tbody id="productTable"></tbody>
</table>

<script>

let products = JSON.parse(localStorage.getItem("products")) || [];

function saveProducts(){
    localStorage.setItem(
        "products",
        JSON.stringify(products)
    );
}

function showMessage(text,type){

    const message =
        document.getElementById("message");

    message.textContent = text;
    message.className =
        "message " + type;

    message.style.display = "block";

    setTimeout(()=>{
        message.style.display="none";
    },4000);
}

function renderProducts(){

    const table =
        document.getElementById("productTable");

    table.innerHTML = "";

    products.forEach((product,index)=>{

        table.innerHTML += `
        <tr>
            <td>${product.name}</td>
            <td>${product.category}</td>
            <td>₦${Number(product.price).toLocaleString()}</td>
            <td>${product.stock}</td>
            <td>
                <button
                class="delete-btn"
                onclick="deleteProduct(${index})">
                Delete
                </button>
            </td>
        </tr>
        `;
    });
}

function addProduct(){

    const name =
        document.getElementById("name").value.trim();

    const category =
        document.getElementById("category").value;

    const price =
        document.getElementById("price").value;

    const stock =
        document.getElementById("stock").value;

if(!name ||  !price || !stock){
showMessage(

            "Please fill all fields",
            "error"
        );

        return;
    }

    products.push({
        name:name,
        category:category,
        price:price,
        stock:stock
    });

    saveProducts();
    renderProducts();

    document.getElementById("name").value="";
    document.getElementById("price").value="";
    document.getElementById("stock").value="";

    showMessage(
        "Product Added Successfully",
        "success"
    );
}

function deleteProduct(index){

    products.splice(index,1);

    saveProducts();
    renderProducts();

    showMessage(
        "Product Deleted Successfully",
        "success"
    );
}

document
.getElementById("addBtn")
.addEventListener(
    "click",
    addProduct
);

renderProducts();

</script>

</body>
</html>
