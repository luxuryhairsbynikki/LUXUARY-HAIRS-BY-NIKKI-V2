<!DOCTYPE html>
<html lang="en">
<head>(
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products - Luxury Hairs by Nikki</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#000,#1a1a1a,#3a2d00);
color:white;

h1{
color:gold;
margin-bottom:20px;
}

.form-box{
background:rgba(255,255,255,.08);
padding:20px;
border-radius:15px;
margin-bottom:30px;
}

input,select{
width:100%;
padding:12px;
margin-bottom:10px;
border:none;
border-radius:8px;
}

button{
background:gold;
color:black;
border:none;
padding:12px 20px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
background:rgba(255,255,255,.08);
border-radius:10px;
overflow:hidden;
}

th{
background:gold;
color:black;
padding:12px;
}

td{
padding:12px;
border-bottom:1px solid rgba(255,255,255,.1);
}

.delete-btn{
background:red;
color:white;
padding:8px 12px;
border:none;
border-radius:5px;
cursor:pointer;
}

.back{
display:inline-block;
margin-bottom:20px;
color:gold;
text-decoration:none;
}

</style>
</head>

<body>

<a href="admin-dashboard.html" class="back">
← Back to Dashboard
</a>

<h1>Products Management</h1>

<div class="form-box">

<input type="text" id="name" placeholder="Product Name">

<select id="category">
<option>Luxury Wigs</option>
<option>Thrift Hairs</option>
<option>Bundles</option>
<option>Closures</option>
<option>Frontals</option>
</select>

<input type="number" id="price" placeholder="Price">

<input type="number" id="stock" placeholder="Stock Quantity">

<button onclick="addProduct()">
Add Product
</button>

</div>

<table>

<thead>
<tr>
<th>Name</th>
<th>Category</th>
<th>Price</th>
<th>Stock</th>
<th>Action</th>
</tr>
</thead>

<tbody id="productTable"></tbody>

</table>

<script>

let products =
JSON.parse(localStorage.getItem("products")) || [];

function saveProducts(){
localStorage.setItem(
"products",
JSON.stringify(products)
);
}

function renderProducts(){

const table =
document.getElementById("productTable");

table.innerHTML = "";

products.forEach((product,index)=>{

table.innerHTML += `
<tr>
<td>${product.name}</td>
<td>${product.category}</td>
<td>₦${product.price}</td>
<td>${product.stock}</td>
<td>
<button
class="delete-btn"
onclick="deleteProduct(${index})">
Delete
</button>
</td>
</tr>
`;

});

}

function addProduct(){

const name =
document.getElementById("name").value;

const category =
document.getElementById("category").value;

const price =
document.getElementById("price").value;

const stock =
document.getElementById("stock").value;

if(!name  !price  !stock){
alert("Fill all fields");
return;
}

products.push({
name,
category,
price,
stock
});

saveProducts();
renderProducts();
"stock").value="";
}

function deleteProduct(index){

if(confirm("Delete product?")){

products.splice(index,1);

saveProducts();
renderProducts();

}

}

renderProducts();

</script>

</body>
</html>
