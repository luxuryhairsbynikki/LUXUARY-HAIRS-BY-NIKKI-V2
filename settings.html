<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Settings</title>

<style>
body{
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#000,#1a1a1a,#3a2d00);
color:white;
padding:30px;
}

h1{
color:gold;
margin-bottom:20px;
}

.card{
background:rgba(255,255,255,.08);
padding:20px;
border-radius:12px;
margin-bottom:15px;
}

label{
display:block;
margin-bottom:5px;
font-weight:bold;
}

input,textarea{
width:100%;
padding:12px;
margin-bottom:15px;
border:none;
border-radius:8px;
}

button{
background:gold;
color:black;
padding:12px 20px;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}
</style>
</head>

<body>

<a href="admin-dashboard.html" style="color:gold;">
← Back to Dashboard
</a>

<h1>Website Settings</h1>

<div class="card">

<label>Store Name</label>
<input type="text" id="storeName">

<label>WhatsApp Number</label>
<input type="text" id="whatsapp">

<label>Email Address</label>
<input type="email" id="email">

<label>Pickup Location</label>
<textarea id="location"></textarea>

<button onclick="saveSettings()">
Save Settings
</button>

</div>

<script>

function loadSettings(){

document.getElementById("storeName").value =
localStorage.getItem("storeName") ||
"Luxury Hairs by Nikki";

document.getElementById("whatsapp").value =
localStorage.getItem("whatsapp") ||
"+2349032641756";

document.getElementById("email").value =
localStorage.getItem("email") ||
"bellaposhylove@gmail.com";

document.getElementById("location").value =
localStorage.getItem("location") ||
"Small Gate, Abraka, Delta State";

}

function saveSettings(){

localStorage.setItem(
"storeName",
document.getElementById("storeName").value
);

localStorage.setItem(
"whatsapp",
document.getElementById("whatsapp").value
);

localStorage.setItem(
"email",
document.getElementById("email").value
);

localStorage.setItem(
"location",
document.getElementById("location").value
);

alert("Settings Saved Successfully");

}

loadSettings();

</script>

</body>
</html>
