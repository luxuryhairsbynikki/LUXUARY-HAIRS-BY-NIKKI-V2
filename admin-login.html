<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - Luxury Hairs by Nikki</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#111;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.login-box{
background:white;
padding:40px;
border-radius:12px;
width:350px;
box-shadow:0 10px 30px rgba(0,0,0,.3);
}

h1{
text-align:center;
margin-bottom:25px;
}

input{
width:100%;
padding:12px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:6px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
background:black;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#333;
}

.error{
color:red;
text-align:center;
margin-top:10px;
}
</style>
</head>

<body>

<div class="login-box">
<h1>Admin Login</h1>

<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

<p class="error" id="error"></p>
</div>

<script>
const ADMIN_EMAIL = "nikkihairhub@gmail.com";
const ADMIN_PASSWORD = "iLOVEDAVIDO001";

function login(){
const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

if(email === ADMIN_EMAIL && password === ADMIN_PASSWORD){
window.location.href = "admin-dashboard.html";
}else{
document.getElementById("error").innerText =
"Invalid email or password";
}
}
</script>

</body>
</html>
